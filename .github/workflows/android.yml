name: Build Korean30min APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate course
        run: python curriculum.py
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/audio
          key: korean-gtts-v1-${{ hashFiles('app/src/main/assets/course.json') }}
      - name: Package offline Korean audio
        run: |
          pip install gTTS==2.5.4
          python generate_audio.py
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: korean30min-debug-signing-v1
      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK signature and embedded audio
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          python - <<'PY'
          import json, zipfile
          data=json.load(open('app/src/main/assets/course.json'))
          names={i['a'] for w in data['weeks'] for i in [*w['words'],w['sentence']]}
          names.update(d['drill']['a'] for d in data['days'] if 'drill' in d)
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              assert all('assets/audio/'+n+'.mp3' in apk.namelist() for n in names)
          PY
          cp app/build/outputs/apk/debug/app-debug.apk Korean30min.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Korean30min-APK
          path: Korean30min.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
